<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pixel Maze</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1020;--ink:#f4f6ff;--mute:#9aa4c7;--btn:#232c52;--hot:#ff9f1c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;overflow:hidden;touch-action:none}
#board{display:flex;gap:6px;padding:10px 12px 0;flex-wrap:wrap;justify-content:center;font-size:15px;font-weight:700}
#board span{background:var(--btn);border-radius:12px;padding:4px 11px;color:var(--mute);border:2px solid transparent}
#board span.cur{border-color:var(--hot);color:var(--ink)}
#board b{color:var(--hot)}
#hud{display:flex;gap:18px;padding:10px 12px 6px;font-size:18px;font-weight:700;flex-wrap:wrap;justify-content:center}
#hud span b{color:var(--hot)}
#wrap{position:relative}
canvas{display:block;border-radius:16px;touch-action:none}
#ov{position:absolute;inset:0;background:rgba(8,12,28,.88);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:16px}
#ov.hide{display:none}
h1{margin:0;font-size:clamp(34px,9vw,56px);color:var(--hot);letter-spacing:1px}
p{margin:0;color:var(--mute);max-width:32ch;line-height:1.4}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
button{font:inherit;font-weight:700;color:var(--ink);background:var(--btn);border:3px solid transparent;border-radius:14px;padding:9px 16px;cursor:pointer}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
button.sel{border-color:var(--hot)}
#pz{width:44px;height:36px;padding:0;font-size:15px}
.row button{min-height:44px}
body{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
#go{background:var(--hot);color:#1b1200;font-size:22px;padding:11px 34px}
</style>
</head>
<body>
<div id="board" aria-label="High scores"></div>
<div id="hud"><span id="hl">Level <b>1</b></span><span id="hs">Score <b>0</b></span><span id="hc">Coins <b>0</b></span><span id="hv">Lives <b>3</b></span><button id="pz" aria-label="Pause">❚❚</button></div>
<div id="wrap">
<canvas id="c" aria-label="Pixel Maze game board"></canvas>
<div id="ov">
<h1 id="t">Pixel Maze</h1>
<p id="m">Eat every coin. Grab a star to make the jellies run, then chase them.</p>
<div class="row" id="ds">
<button data-d="easy">Easy</button><button data-d="medium" class="sel">Medium</button><button data-d="hard">Hard</button><button data-d="vhard">Very Hard</button>
</div>
<p id="dd">3 jellies that chase you about half the time. A real challenge.</p>
<button id="go">Play</button>
<div class="row" id="pr" style="display:none"><button id="rs">Resume</button><button id="rt">Restart</button><button id="mn">Main menu</button></div>
<div class="row"><button id="sn">Sound: on</button><button id="hp">Haptics: on</button><button id="fxb">Effects: full</button></div>
<p>Swipe anywhere or use arrows/WASD. P or Esc pauses. ★ scares jellies, ⚡ speed, 🛡 blocks one hit, ❄ freezes jellies.</p>
</div>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const DIRS=[[1,0],[0,1],[-1,0],[0,-1]];
const TH=[
 {n:'Jungle',bg:'#0e2a1b',w:'#2fa35a',w2:'#16542d',coin:'#ffe66d',fx:'#7ddc6e',mv:[.2,1]},
 {n:'Space',bg:'#120a2e',w:'#7b5cff',w2:'#3a2a8c',coin:'#9ef0ff',fx:'#ffffff',mv:[0,0]},
 {n:'Underwater',bg:'#06283d',w:'#19b5d6',w2:'#0b5f78',coin:'#ffd6e0',fx:'#bdefff',mv:[.1,-1]}];
const DIFF={easy:{g:2,gs:3,ch:.1,fear:9,rel:3},medium:{g:3,gs:4.3,ch:.5,fear:6,rel:2},hard:{g:4,gs:5,ch:.7,fear:4.5,rel:1.5},vhard:{g:5,gs:5.6,ch:.9,fear:3,rel:1}};
const DESC={easy:'2 slow jellies and long star power. Great for learning.',medium:'3 jellies that chase you about half the time. A real challenge.',hard:'4 fast jellies that hunt you down. Stars wear off quickly.',vhard:'5 near-top-speed jellies and very short star power. Good luck!'};
const TUNE={easy:{g:2,gs:3,fear:9,rel:3,pu:1,sc:8,cs:6,br:.3},medium:{g:3,gs:4,fear:6.5,rel:2.2,pu:2,sc:6,cs:10,br:.4},hard:{g:4,gs:4.6,fear:5,rel:1.6,pu:3,sc:5,cs:14,br:.6},vhard:{g:4,gs:5,fear:4,rel:1.2,pu:4,sc:4,cs:18,br:.9}};
for(const k in TUNE)Object.assign(DIFF[k],TUNE[k]);
Object.assign(DESC,{easy:'2 slow jellies, long star power. Great for learning.',medium:'3 jellies with different habits. They take breaks from chasing.',hard:'4 smart jellies that ambush and cut you off. More loops and power-ups.',vhard:'4 sharp jellies, short star power. Plan routes and use shields and freezes.'});
document.getElementById('dd').textContent=DESC.medium;
const NAMES={easy:'Easy',medium:'Medium',hard:'Hard',vhard:'Very Hard'};
const GC=['#ff6b9d','#ffa94d','#4dd4ff','#b197fc','#7ee081'];
let diff='medium',cfg=DIFF.medium,L=1,score=0,lives=3,coins=0,saved=0,state='menu';
let maze,N,ts,theme,dots,left,P,ghosts,fear=0,boost=0,ready=0,parts=[],bg=[],T=0;
let chain=0,shield=0,frz=0,mode=0,mt=0,paused=false,shake=0,accum=0,hdirty=1,cache=null,fdt=.016;
let hs={};
try{saved=+localStorage.getItem('pm_coins')||0;hs=JSON.parse(localStorage.getItem('pm_hs'))||{}}catch(e){}
function renderBoard(){
 document.getElementById('board').innerHTML=Object.keys(NAMES).map(k=>'<span class="'+(k===diff?'cur':'')+'">'+NAMES[k]+' <b>'+(hs[k]||0)+'</b></span>').join('');
}
function save(){try{localStorage.setItem('pm_coins',saved)}catch(e){}}
let set={snd:1,hap:1,fx:1};
try{Object.assign(set,JSON.parse(localStorage.getItem('pm_set')))}catch(e){}
let AC=null;
function sfx(f,d,t){if(!set.snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t||'square';o.frequency.value=f;g.gain.setValueAtTime(.05,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function buzz(ms){if(set.hap&&navigator.vibrate)try{navigator.vibrate(ms)}catch(e){}}
const ok=(x,y)=>maze[y]&&maze[y][x]===0;
function gen(n){
 const S=2*n+1,m=Array.from({length:S},()=>Array(S).fill(1));
 const seen=Array.from({length:n},()=>Array(n).fill(0)),st=[[0,0]];seen[0][0]=1;m[1][1]=0;
 while(st.length){
  const [cx,cy]=st[st.length-1],o=DIRS.map((d,i)=>i).sort(()=>Math.random()-.5);
  let moved=false;
  for(const i of o){const nx=cx+DIRS[i][0],ny=cy+DIRS[i][1];
   if(nx>=0&&ny>=0&&nx<n&&ny<n&&!seen[ny][nx]){seen[ny][nx]=1;m[2*ny+1][2*nx+1]=0;m[cy+ny+1][cx+nx+1]=0;st.push([nx,ny]);moved=true;break}}
  if(!moved)st.pop();
 }
 for(let k=0;k<n*n*(cfg.br||.33);k++){const x=1+Math.floor(Math.random()*(S-2)),y=1+Math.floor(Math.random()*(S-2));
  if(m[y][x]&&((x%2===0&&y%2===1&&!m[y][x-1]&&!m[y][x+1])||(y%2===0&&x%2===1&&!m[y-1][x]&&!m[y+1][x])))m[y][x]=0}
 return m;
}
function ent(x,y){return{x,y,tx:x,ty:y,p:0,dir:0}}
function setup(){
 const n=Math.min(6+L,11);N=2*n+1;maze=gen(n);theme=TH[(L-1)%3];
 dots=maze.map(r=>r.map(v=>v?0:1));dots[1][1]=0;
 const c=2*Math.floor(n/2)+1;dots[c][c]=0;
 dots[N-2][1]=2;dots[1][N-2]=2;dots[N-2][N-2]=2;
 for(let k=0;k<cfg.pu;k++){let bx,by,tries=0;do{bx=1+Math.floor(Math.random()*(N-2));by=1+Math.floor(Math.random()*(N-2))}while((maze[by][bx]||dots[by][bx]!==1||bx+by<N/2)&&++tries<300);if(tries<300)dots[by][bx]=[3,4,5][k%3]}
 left=0;dots.forEach(r=>r.forEach(v=>{if(v)left++}));
 P=ent(1,1);P.want=-1;resetGhosts(c);fear=0;boost=0;ready=2;mode=0;mt=0;chain=0;shield=0;frz=0;cache=null;resize();hud();
 bg=Array.from({length:36},()=>({x:Math.random(),y:Math.random(),r:1+Math.random()*3,s:Math.random()*6}));
}
function resetGhosts(c){
 c=c||2*Math.floor(((N-1)/2)/2)+1;
 ghosts=Array.from({length:cfg.g},(_,i)=>{const g=ent(c,c);g.rel=cfg.rel*(i+1)*.8;g.col=GC[i];g.i=i;g.eyes=0;return g});
}
function resize(){
 const s=Math.floor(Math.min(innerWidth-12,innerHeight-112,640)),d=devicePixelRatio||1;
 ts=s/N;cache=null;cv.style.width=cv.style.height=s+'px';cv.width=cv.height=Math.round(s*d);ctx.setTransform(d,0,0,d,0,0);
 const ov=document.getElementById('ov');ov.style.width=ov.style.height=s+'px';
}
addEventListener('resize',()=>{if(maze)resize()});
function hud(){hdirty=1}
function hudNow(){hdirty=0;
 if(score>(hs[diff]||0)){hs[diff]=score;try{localStorage.setItem('pm_hs',JSON.stringify(hs))}catch(e){}}
 renderBoard();
 document.getElementById('hl').innerHTML='Level <b>'+L+'</b> '+theme.n;
 document.getElementById('hs').innerHTML='Score <b>'+score+'</b>';
 document.getElementById('hc').innerHTML='Coins <b>'+coins+'</b>';
 document.getElementById('hv').innerHTML='Lives <b>'+'♥'.repeat(Math.max(lives,0))+'</b>';
}
function burst(x,y,col,n){if(!set.fx)n=Math.ceil(n/3);for(let i=0;i<n;i++){const a=Math.random()*6.28,s=1+Math.random()*3;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.6,c:col})}}
function adv(e,dt,sp,pick,arrive){
 e.p+=sp*dt;
 while(e.p>=1){
  e.p-=1;e.x=e.tx;e.y=e.ty;if(arrive)arrive(e);
  const d=pick(e);
  if(d<0){e.p=0;e.tx=e.x;e.ty=e.y;break}
  e.dir=d;e.tx=e.x+DIRS[d][0];e.ty=e.y+DIRS[d][1];
 }
}
function pickP(e){
 if(e.want>=0&&ok(e.x+DIRS[e.want][0],e.y+DIRS[e.want][1]))return e.want;
 return ok(e.x+DIRS[e.dir][0],e.y+DIRS[e.dir][1])?e.dir:-1;
}
function eat(e){
 const t=dots[e.y][e.x];if(!t)return;
 dots[e.y][e.x]=0;left--;score+=10;coins++;saved++;
 burst((e.x+.5)*ts,(e.y+.5)*ts,theme.coin,4);
 if(t===1)sfx(900,.03);
 if(t===2){chain=0;sfx(520,.25,'triangle');buzz(15);fear=cfg.fear;score+=50;burst((e.x+.5)*ts,(e.y+.5)*ts,'#fff',16)}
 if(t===4){shield=1;sfx(660,.2,'triangle')}
 if(t===5){frz=4;sfx(300,.3,'sawtooth')}
 if(t===3){sfx(880,.15);boost=5;burst((e.x+.5)*ts,(e.y+.5)*ts,'#ff9f1c',16)}
 hud();
}
function pickG(g){
 let o=[0,1,2,3].filter(d=>ok(g.x+DIRS[d][0],g.y+DIRS[d][1]));
 const back=(g.dir+2)%4;if(o.length>1)o=o.filter(d=>d!==back);
 if(fear>0){let b=o[0],bm=-1;for(const d of o){const dd=Math.hypot(g.x+DIRS[d][0]-P.x,g.y+DIRS[d][1]-P.y)+Math.random();if(dd>bm){bm=dd;b=d}}return b}
 let tx,ty;const pd=DIRS[P.dir],c=ghosts[0];
 if(mode===0){tx=g.i%2?N-2:1;ty=g.i>1?N-2:1}
 else switch(g.i){
  case 0:tx=P.x;ty=P.y;break;
  case 1:tx=P.x+pd[0]*4;ty=P.y+pd[1]*4;break;
  case 2:tx=2*(P.x+pd[0]*2)-c.x;ty=2*(P.y+pd[1]*2)-c.y;break;
  default:if(Math.abs(g.x-P.x)+Math.abs(g.y-P.y)>8){tx=P.x;ty=P.y}else{tx=1;ty=N-2}}
 let best=o[0],bd=1e9;
 for(const d of o){const dd=Math.hypot(g.x+DIRS[d][0]-tx,g.y+DIRS[d][1]-ty)+Math.random()*.8;if(dd<bd){bd=dd;best=d}}
 return Math.random()<.08?o[Math.floor(Math.random()*o.length)]:best;
}
function update(dt){
 T+=dt;
 parts.forEach(p=>{p.x+=p.vx*dt*60;p.y+=p.vy*dt*60;p.l-=dt});parts=parts.filter(p=>p.l>0);
 if(state!=='play')return;
 if(ready>0){ready-=dt;return}
 mt+=dt;if(mt>(mode?cfg.cs:cfg.sc)){mode^=1;mt=0}
 fear=Math.max(0,fear-dt);boost=Math.max(0,boost-dt);frz=Math.max(0,frz-dt);
 adv(P,dt,5.6*(boost>0?1.4:1),pickP,eat);
 const gs=cfg.gs*(1+.02*Math.min(L-1,6));
 for(const g of ghosts){
  if(g.rel>0){g.rel-=dt;continue}
  if(frz<=0)adv(g,dt,fear>0?gs*.6:gs,pickG);
 }
 const pp=pos(P);
 for(const g of ghosts){
  if(g.rel>0)continue;const q=pos(g);
  if(Math.hypot(pp[0]-q[0],pp[1]-q[1])<.6*ts){
   if(fear>0){chain=Math.min(chain+1,4);score+=100*(1<<chain);sfx(700,.2);buzz(30);coins+=5;saved+=5;burst(q[0],q[1],g.col,24);const c=2*Math.floor(((N-1)/2)/2)+1;Object.assign(g,ent(c,c),{rel:3});hud()}
   else if(shield){shield=0;frz=1.5;shake=.3;sfx(220,.3,'sawtooth');buzz(60);burst(pp[0],pp[1],'#66ccff',24);const c=2*Math.floor(((N-1)/2)/2)+1;Object.assign(g,ent(c,c),{rel:2})}
   else{lives--;shake=.4;sfx(150,.5,'sawtooth');buzz(120);burst(pp[0],pp[1],'#ff9f1c',30);hud();
    if(lives<=0){over();return}
    P=ent(1,1);P.want=-1;resetGhosts();ready=1.5;boost=0;break}
  }
 }
 if(left<=0){L++;score+=100*L;save();setup()}
}
const pos=e=>[(e.x+(e.tx-e.x)*e.p+.5)*ts,(e.y+(e.ty-e.y)*e.p+.5)*ts];
function draw(){
 const s=ts*N;ctx.save();if(shake>0){shake-=fdt;if(set.fx)ctx.translate((Math.random()-.5)*ts*.4,(Math.random()-.5)*ts*.4)}
 ctx.fillStyle=theme.bg;ctx.fillRect(0,0,s,s);
 ctx.fillStyle=theme.fx;
 for(const b of bg){
  const f=theme.mv;b.y=(b.y+f[1]*.036*fdt+1)%1;b.x=(b.x+Math.sin(T+b.s)*f[0]*.024*fdt+1)%1;
  ctx.globalAlpha=theme.mv[1]===0?.3+.5*Math.abs(Math.sin(T*2+b.s)):.35;
  ctx.beginPath();ctx.arc(b.x*s,b.y*s,b.r,0,6.28);ctx.fill();
 }
 ctx.globalAlpha=1;
 drawWalls();
 for(let y=0;y<N;y++)for(let x=0;x<N;x++){
  if(maze[y][x]){}else if(dots[y][x]){
   const t=dots[y][x],cx=(x+.5)*ts,cy=(y+.5)*ts;
   if(t===1){ctx.fillStyle=theme.coin;ctx.beginPath();ctx.arc(cx,cy,ts*.13,0,6.28);ctx.fill()}
   else{ctx.font=ts*.8+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.save();ctx.translate(cx,cy);ctx.scale(1+.15*Math.sin(T*6),1+.15*Math.sin(T*6));
    ctx.fillStyle='#fff7a8';ctx.fillText(['','','★','⚡','🛡','❄'][t],0,0);ctx.restore()}
  }
 }
 // ghosts
 for(const g of ghosts){
  const [x,y]=pos(g),r=ts*.4,sc=fear>0,blink=sc&&fear<1.5&&Math.floor(T*8)%2;
  ctx.globalAlpha=(mode===0&&!sc&&frz<=0)?.65:1;ctx.fillStyle=frz>0?'#bfefff':sc?(blink?'#fff':'#3b5bff'):g.col;
  ctx.beginPath();ctx.moveTo(x-r,y+r);ctx.lineTo(x-r,y);ctx.arc(x,y,r,Math.PI,0);ctx.lineTo(x+r,y+r);
  for(let k=1;k<=6;k++)ctx.lineTo(x+r-k*r/3,y+r-(k%2?r*.3+Math.sin(T*10)*r*.08:0));
  ctx.closePath();ctx.fill();
  ctx.fillStyle='#fff';for(const sx of[-1,1]){ctx.beginPath();ctx.arc(x+sx*r*.42,y-r*.15,r*.26,0,6.28);ctx.fill()}
  ctx.fillStyle=sc?'#c00':'#111';const d=DIRS[g.dir];
  for(const sx of[-1,1]){ctx.beginPath();ctx.arc(x+sx*r*.42+d[0]*r*.1,y-r*.15+d[1]*r*.1,r*.12,0,6.28);ctx.fill()}
 }
 ctx.globalAlpha=1;// player
 {const [x,y]=pos(P),r=ts*.42,m=.05+.22*Math.abs(Math.sin(T*14)),a=P.dir*Math.PI/2;
  if(shield){ctx.strokeStyle='#66ccff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,r*1.4,0,6.28);ctx.stroke()}
  if(boost>0){ctx.fillStyle='rgba(255,159,28,.3)';ctx.beginPath();ctx.arc(x,y,r*1.5,0,6.28);ctx.fill()}
  ctx.fillStyle='#ff9f1c';ctx.beginPath();ctx.moveTo(x,y);ctx.arc(x,y,r,a+m*Math.PI,a-m*Math.PI+6.2832);ctx.closePath();ctx.fill();
  ctx.fillStyle='#1b1200';ctx.beginPath();ctx.arc(x+Math.cos(a-1.2)*r*.5,y+Math.sin(a-1.2)*r*.5,r*.12,0,6.28);ctx.fill();}
 for(const p of parts){ctx.globalAlpha=Math.max(p.l,0)/.6;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,ts*.07,0,6.28);ctx.fill()}
 ctx.globalAlpha=1;
 ctx.restore();drawFx();
 if(state==='play'&&ready>0){
  ctx.fillStyle='rgba(8,12,28,.7)';ctx.fillRect(0,s/2-ts*1.1,s,ts*2.2);
  ctx.fillStyle='#fff';ctx.font='700 '+ts*1.1+'px Fredoka,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(ready>1.5&&L>1?theme.n+' – Level '+L:'Get ready!',s/2,s/2);
 }
}
function over(){
 state='over';hudNow();save();
 document.getElementById('t').textContent='Game over';
 document.getElementById('m').textContent='You reached level '+L+' with '+score+' points. Best on '+NAMES[diff]+': '+(hs[diff]||0)+'. Coins saved: '+saved+'.';
 document.getElementById('go').textContent='Play again';
 document.getElementById('ov').classList.remove('hide');
}
document.getElementById('ds').onclick=e=>{
 const d=e.target.dataset.d;if(!d)return;diff=d;document.getElementById('dd').textContent=DESC[d];renderBoard();
 document.querySelectorAll('#ds button').forEach(b=>b.classList.toggle('sel',b===e.target));
};
function startGame(){cfg=DIFF[diff];L=1;score=0;lives=3;coins=0;paused=false;shake=0;setup();state='play';document.getElementById('ov').classList.add('hide');sfx(440,.1)}
document.getElementById('go').onclick=startGame;
document.getElementById('pz').onclick=()=>togglePause();
document.getElementById('rs').onclick=resume;
document.getElementById('rt').onclick=startGame;
document.getElementById('mn').onclick=()=>{paused=false;state='menu';showOv('Pixel Maze','Pick a difficulty and play.',false)};
function want(d){
 if(!P)return;P.want=d;
 if(state==='play'&&(P.x!==P.tx||P.y!==P.ty)&&d===(P.dir+2)%4){
  [P.x,P.tx]=[P.tx,P.x];[P.y,P.ty]=[P.ty,P.y];P.p=1-P.p;P.dir=d;
 }
}
addEventListener('keydown',e=>{if(e.key==='Escape'||e.key==='p'){togglePause();return}
 const k={ArrowRight:0,d:0,ArrowDown:1,s:1,ArrowLeft:2,a:2,ArrowUp:3,w:3}[e.key.length>1?e.key:e.key.toLowerCase()];
 if(k!==undefined){want(k);e.preventDefault()}
});
let t0=null;
addEventListener('pointerdown',e=>{if(state==='play'&&!paused&&!e.target.closest('button'))t0=[e.clientX,e.clientY]});
addEventListener('pointermove',e=>{
 if(!t0)return;const dx=e.clientX-t0[0],dy=e.clientY-t0[1];
 if(Math.max(Math.abs(dx),Math.abs(dy))>12){want(Math.abs(dx)>Math.abs(dy)?(dx>0?0:2):(dy>0?1:3));t0=[e.clientX,e.clientY]}
});
['pointerup','pointercancel','blur'].forEach(n=>addEventListener(n,()=>{t0=null}));
addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play'&&!paused)togglePause()});
function showOv(t,m,ps){
 document.getElementById('t').textContent=t;document.getElementById('m').textContent=m;
 for(const id of['ds','go','dd'])document.getElementById(id).style.display=ps?'none':'';
 document.getElementById('pr').style.display=ps?'flex':'none';
 document.getElementById('ov').classList.remove('hide');
}
function resume(){paused=false;document.getElementById('ov').classList.add('hide');last=performance.now();t0=null}
function togglePause(){if(paused)resume();else if(state==='play'){paused=true;showOv('Paused','Level '+L+' · Score '+score,true)}}
function lab(){document.getElementById('sn').textContent='Sound: '+(set.snd?'on':'off');document.getElementById('hp').textContent='Haptics: '+(set.hap?'on':'off');document.getElementById('fxb').textContent='Effects: '+(set.fx?'full':'reduced')}
function saveSet(){try{localStorage.setItem('pm_set',JSON.stringify(set))}catch(e){}lab()}
document.getElementById('sn').onclick=()=>{set.snd^=1;saveSet();sfx(600,.1)};
document.getElementById('hp').onclick=()=>{set.hap^=1;saveSet();buzz(30)};
document.getElementById('fxb').onclick=()=>{set.fx^=1;saveSet()};lab();
function drawWalls(){
 if(!cache){cache=document.createElement('canvas');cache.width=cv.width;cache.height=cv.height;const c=cache.getContext('2d'),d=cv.width/(ts*N);c.scale(d,d);
  for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(maze[y][x]){c.fillStyle=theme.w2;c.fillRect(x*ts,y*ts,ts+.5,ts+.5);c.fillStyle=theme.w;const i=ts*.14;c.beginPath();c.roundRect(x*ts+i,y*ts+i,ts-2*i,ts-2*i,ts*.2);c.fill()}}
 ctx.drawImage(cache,0,0,ts*N,ts*N);
}
function drawFx(){
 const a=[];if(fear>0)a.push(['★',fear,cfg.fear]);if(boost>0)a.push(['⚡',boost,5]);if(frz>0)a.push(['❄',frz,4]);if(shield)a.push(['🛡',1,1]);
 ctx.font=(ts*.7)+'px sans-serif';ctx.textAlign='left';ctx.textBaseline='middle';
 a.forEach((q,i)=>{const x=ts*(.3+i*2.6),y=ts*.5;ctx.fillStyle='rgba(8,12,28,.75)';ctx.fillRect(x,y-ts*.4,ts*2.4,ts*.8);ctx.fillStyle='#fff';ctx.fillText(q[0],x+ts*.1,y);ctx.fillStyle='#ff9f1c';ctx.fillRect(x+ts*.9,y-ts*.1,ts*1.4*Math.min(q[1]/q[2],1),ts*.2)});
}
let last=performance.now();
function loop(n){
 const el=Math.min((n-last)/1000,.25);fdt=Math.min(el,.05);last=n;
 if(!paused){accum+=el;let k=0;while(accum>=1/120&&k++<30){update(1/120);accum-=1/120}}else accum=0;
 if(hdirty)hudNow();
 draw();requestAnimationFrame(loop)}
setup();requestAnimationFrame(loop);
</script>
